name: Backend health monitor

on:
  schedule:
    # Offset from the hour; allow margin below Render's 15-minute idle timeout.
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check backend health
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 120 \
            --retry 1 --retry-delay 5 --retry-all-errors \
            --output /tmp/backend-health.json \
            --write-out 'HTTP %{http_code}; duration %{time_total}s\n' \
            https://jobfitax-search.onrender.com/health
          python3 - <<'PY'
          import json
          with open('/tmp/backend-health.json') as response:
              body = json.load(response)
          if body.get('status') != 'ok':
              raise SystemExit('Backend returned an unexpected health response')
          print('Backend health: ok')
          PY
